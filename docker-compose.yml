services:
  # Servicio principal para ejecutar la aplicación con interfaz visual web (noVNC)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace_manager_app
    ports:
      - "6080:6080"  # Interfaz gráfica en tu navegador: http://localhost:6080/vnc.html
      - "5900:5900"  # Conexión directa con clientes VNC
    environment:
      - ENABLE_VNC=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
    command: ["python", "main.py"]
    restart: unless-stopped

  # Servicio para ejecutar la suite de pruebas unitarias/integración en el contenedor
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace_manager_tests
    environment:
      - ENABLE_VNC=0
      - QT_QPA_PLATFORM=offscreen
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "pytest", "-q"]
